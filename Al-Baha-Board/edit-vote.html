<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل التصويت - جمعية أدبي الباحة</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .option-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .option-row input {
            flex: 1;
            margin-bottom: 0;
        }
        .btn-remove-opt {
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            width: 42px;
            height: 48px;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .btn-remove-opt:hover {
            background-color: #dc2626;
        }
        .btn-add-opt {
            background-color: #f1f5f9;
            color: #1e293b;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
            transition: 0.2s;
        }
        .btn-add-opt:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }
        .vote-badge {
            font-size: 0.75rem;
            color: #64748b;
            white-space: nowrap;
            background: #eef2f6;
            padding: 4px 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="content form-content">
    <div class="form-page">
        <div class="form-card">
            <h2>✏️ تعديل التصويت والخيارات</h2>

            <div class="form-group">
                <label>نص السؤال / الموضوع</label>
                <input id="editQuestion" placeholder="مثال: موعد الاجتماع القادم">
            </div>

            <div class="form-group">
                <label>خيارات التصويت</label>
                <div id="optionsContainer">
                    <!-- الخيارات تظهر هنا ديناميكياً -->
                </div>
                <button type="button" class="btn-add-opt" onclick="addOptionField()">➕ إضافة خيار آخر</button>
            </div>

            <div class="form-buttons">
                <button class="primary-btn" onclick="updateVote()"> حفظ التعديلات</button>
                <button class="cancel-btn" onclick="history.back()">↩ تراجع</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDRe0sxYnR7QVzhXkbR3H0ZhLcfxla7LgA",
        authDomain: "al-baha-literary-club-board.firebaseapp.com",
        projectId: "al-baha-literary-club-board",
        storageBucket: "al-baha-literary-club-board.firebasestorage.app",
        messagingSenderId: "451049449840",
        appId: "1:451049449840:web:9c3b9aca29d0c97b8287b5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const voteId = new URLSearchParams(location.search).get("id");

    let existingOptions = [];

    // تحميل بيانات السؤال والخيارات الحالية
    async function loadData() {
        if (!voteId) {
            alert("لم يتم تحديد التصويت!");
            location.href = "votes.html";
            return;
        }

        try {
            const snap = await getDoc(doc(db, "votes", voteId));
            if (snap.exists()) {
                const data = snap.data();
                document.getElementById("editQuestion").value = data.question || "";
                existingOptions = data.options || [];

                renderOptions();
            } else {
                alert("التصويت غير موجود");
                location.href = "votes.html";
            }
        } catch (error) {
            console.error("خطأ أثناء جلب التصويت:", error);
        }
    }

    // رسم حقول الخيارات في الصفحة
    function renderOptions() {
        const container = document.getElementById("optionsContainer");
        container.innerHTML = "";

        existingOptions.forEach((opt, index) => {
            const voteCount = (opt.votes || []).length;
            const row = document.createElement("div");
            row.className = "option-row";
            row.innerHTML = `
                <input type="text" class="opt-input" value="${opt.text || ''}" placeholder="الخيار رقم ${index + 1}">
                <span class="vote-badge">${voteCount} صوت</span>
                <button type="button" class="btn-remove-opt" onclick="removeOptionField(${index})" title="حذف الخيار">🗑️</button>
            `;
            container.appendChild(row);
        });
    }

    // إضافة حقل خيار جديد
    window.addOptionField = function() {
        existingOptions.push({ text: "", votes: [] });
        renderOptions();
    };

    // حذف خيار معين
    window.removeOptionField = function(index) {
        if (existingOptions.length <= 2) {
            alert("يجب أن يحتوي التصويت على خيارين على الأقل!");
            return;
        }
        existingOptions.splice(index, 1);
        renderOptions();
    };

    // حفظ التعديلات في Firestore
    window.updateVote = async function() {
        const question = document.getElementById("editQuestion").value.trim();
        const inputElements = document.querySelectorAll(".opt-input");

        if (!question) {
            alert("يرجى كتابة نص السؤال");
            return;
        }

        const updatedOptions = [];
        for (let i = 0; i < inputElements.length; i++) {
            const val = inputElements[i].value.trim();
            if (val !== "") {
                updatedOptions.push({
                    text: val,
                    votes: existingOptions[i]?.votes || [] // الحفاظ على أصوات المصوتين السابقة
                });
            }
        }

        if (updatedOptions.length < 2) {
            alert("يرجى إدخال خيارين على الأقل للتصويت");
            return;
        }

        try {
            await updateDoc(doc(db, "votes", voteId), {
                question: question,
                options: updatedOptions
            });

            alert("تم تحديث التصويت والخيارات بنجاح!");
            location.href = "votes.html";
        } catch (error) {
            console.error("خطأ أثناء التحديث:", error);
            alert("حدث خطأ أثناء حفظ التعديل");
        }
    };

    loadData();
</script>
</body>
</html>
