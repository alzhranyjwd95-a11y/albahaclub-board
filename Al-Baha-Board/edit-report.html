<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل التقرير - جمعية أدبي الباحة</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .current-file-badge {
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: inline-block;
            font-size: 0.85rem;
            color: #334155;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>

<body>


<div class="sidebar">


    <div class="sidebar-brand">

        <h2>
            جمعية أدبي الباحة
        </h2>

    </div>


    <ul class="sidebar-menu">


        <li>
            <a href="dashboard.html">
                🏠 الرئيسية
            </a>
        </li>


        <li>
            <a href="meetings.html">
                📅 الاجتماعات
            </a>
        </li>


        <li>
            <a href="minutes.html">
                📄 المحاضر
            </a>
        </li>


        <li>
            <a href="tasks.html">
                ️☑️ المهام
            </a>
        </li>


        <li>
            <a href="votes.html">
                📊  التصويتات
            </a>
        </li>


        <li>
            <a href="decisions.html">
                ️ ⚖️ القرارات
            </a>
        </li>


        <li>
            <a href="files.html">
                📁 الملفات والمستندات
            </a>
        </li>


        <li class="active">
            <a href="reports.html">
                📈 التقارير
            </a>
        </li>


    </ul>

</div>





<div class="main-wrapper">


    <div class="topbar">

        <div class="brand-header">


            <div>

                <h1>
                    جمعية أدبي الباحة
                </h1>


                <p>
                    منصة مجلس الإدارة
                </p>


            </div>


        </div>

    </div>






    <div class="dashboard-body">



        <div class="form-page">


            <div class="form-card">





                <div class="form-group">

                    <label>
                        عنوان أو نوع التقرير
                    </label>


                    <input id="title"
                           placeholder="عنوان التقرير">


                </div>







                <div class="form-group">

                    <label>
                        تاريخ التقرير
                    </label>


                    <input
                            type="date"
                            id="reportDate">


                </div>







                <div class="form-group">

                    <label>
                        ملخص / تفاصيل التقرير
                    </label>


                    <textarea
                            id="description"
                            rows="3">
</textarea>


                </div>







                <div class="form-group">

                    <label>
                        ملف التقرير الحالي
                    </label>


                    <div id="currentFileBox"
                         class="current-file-badge">

                        جاري جلب الملف الحالي...

                    </div>



                    <input
                            type="file"
                            id="fileInput">


                    <small>
                        اختر ملف جديد فقط إذا أردت استبداله
                    </small>


                </div>






                <p id="uploadStatus"
                   style="display:none">

                    جاري حفظ التعديلات...

                </p>







                <div class="form-buttons">


                    <button
                            class="primary-btn"
                            id="saveBtn"
                            onclick="updateReport()">


                         حفظ التعديلات


                    </button>




                    <button
                            class="cancel-btn"
                            onclick="history.back()">


                        ↩ تراجع


                    </button>



                </div>






            </div>



        </div>




    </div>



</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDRe0sxYnR7QVzhXkbR3H0ZhLcfxla7LgA",
        authDomain: "al-baha-literary-club-board.firebaseapp.com",
        projectId: "al-baha-literary-club-board",
        storageBucket: "al-baha-literary-club-board.firebasestorage.app",
        messagingSenderId: "451049449840",
        appId: "1:451049449840:web:9c3b9aca29d0c97b8287b5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const reportId = new URLSearchParams(location.search).get("id");

    let oldReportData = null;

    // جلب بيانات التقرير الحالي
    async function loadReportData() {
        if (!reportId) {
            alert("لم يتم العثور على التقرير!");
            location.href = "reports.html";
            return;
        }

        try {
            const snap = await getDoc(doc(db, "reports", reportId));
            if (snap.exists()) {
                oldReportData = snap.data();
                document.getElementById("title").value = oldReportData.title || "";
                document.getElementById("reportDate").value = oldReportData.reportDate || "";
                document.getElementById("description").value = oldReportData.description || "";

                const fileBox = document.getElementById("currentFileBox");
                if (oldReportData.fileName) {
                    fileBox.innerHTML = `📎 الملف الحالي: <b>${oldReportData.fileName}</b>`;
                } else {
                    fileBox.innerHTML = `📎 يوجد ملف مرفق مسجل سابقاً`;
                }
            } else {
                alert("التقرير غير موجود!");
                location.href = "reports.html";
            }
        } catch (err) {
            console.error(err);
            alert("حدث خطأ أثناء تحميل بيانات التقرير");
        }
    }

    // حفظ التحديثات
    window.updateReport = async function() {
        const title = document.getElementById("title").value.trim();
        const reportDate = document.getElementById("reportDate").value;
        const description = document.getElementById("description").value.trim();
        const fileInput = document.getElementById("fileInput");
        const file = fileInput.files[0];
        const statusText = document.getElementById("uploadStatus");
        const saveBtn = document.getElementById("saveBtn");

        if (!title || !reportDate) {
            alert("يرجى تعبئة عنوان التقرير وتاريخه");
            return;
        }

        saveBtn.disabled = true;
        statusText.style.display = "block";

        const updateData = {
            title: title,
            reportDate: reportDate,
            description: description
        };

        // إذا اختار ملفاً جديداً لاستبدال القديم
        if (file) {
            if (file.size > 1024 * 1024) {
                alert("حجم الملف يتجاوز 1 ميجابايت!");
                saveBtn.disabled = false;
                statusText.style.display = "none";
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    updateData.fileData = e.target.result;
                    updateData.fileName = file.name;
                    updateData.fileType = file.type || "application/octet-stream";

                    await updateDoc(doc(db, "reports", reportId), updateData);
                    alert("تم تعديل التقرير واستبدال الملف بنجاح!");
                    location.href = "reports.html";
                } catch (err) {
                    console.error(err);
                    alert("حدث خطأ أثناء الحفظ");
                    saveBtn.disabled = false;
                    statusText.style.display = "none";
                }
            };
            reader.readAsDataURL(file);
        } else {
            // حفظ التعديلات النصية فقط مع بقاء الملف القديم
            try {
                await updateDoc(doc(db, "reports", reportId), updateData);
                alert("تم تعديل بيانات التقرير بنجاح!");
                location.href = "reports.html";
            } catch (err) {
                console.error(err);
                alert("حدث خطأ أثناء الحفظ");
                saveBtn.disabled = false;
                statusText.style.display = "none";
            }
        }
    };

    loadReportData();
</script>
</body>
</html>
