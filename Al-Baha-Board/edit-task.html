    </title>


    <link rel="stylesheet" href="style.css">

</head>



<body>



<div class="sidebar">


    <div class="sidebar-brand">

        <h2>
            جمعية أدبي الباحة
        </h2>

    </div>




    <ul class="sidebar-menu">


        <li>

            <a href="dashboard.html">
                🏠 الرئيسية
            </a>

        </li>



        <li>

            <a href="meetings.html">
                📅 الاجتماعات
            </a>

        </li>



        <li>

            <a href="minutes.html">
                📄 المحاضر
            </a>

        </li>




        <li class="active">

            <a href="tasks.html">
                ☑️ المهام
            </a>

        </li>




        <li>

            <a href="votes.html">
                📊 التصويتات
            </a>

        </li>




        <li>

            <a href="decisions.html">
                ⚖️ القرارات
            </a>

        </li>




        <li>

            <a href="files.html">
                📁 الملفات والمستندات
            </a>

        </li>




        <li>

            <a href="reports.html">
                📈 التقارير
            </a>

        </li>



    </ul>


</div>








<div class="main-wrapper">



    <div class="topbar">


        <div class="brand-header">


            <div>

                <h1>
                    جمعية أدبي الباحة
                </h1>


                <p>
                    منصة مجلس الإدارة
                </p>


            </div>


        </div>


    </div>







    <div class="dashboard-body">





        <div class="form-page">



            <div class="form-card">





                <div class="form-group">

                    <label>
                        اسم المهمة
                    </label>


                    <input id="title">


                </div>






                <div class="form-group">

                    <label>
                        المسؤول
                    </label>


                    <input id="assignedTo">


                </div>






                <div class="form-group">

                    <label>
                        تاريخ الاستحقاق
                    </label>


                    <input type="date" id="date">


                </div>






                <div class="form-group">

                    <label>
                        الحالة
                    </label>


                    <select id="status">


                        <option>
                            جديدة
                        </option>


                        <option>
                            قيد التنفيذ
                        </option>


                        <option>
                            مكتملة
                        </option>


                    </select>


                </div>







                <div class="form-group">

                    <label>
                        التفاصيل
                    </label>


                    <textarea id="description"></textarea>


                </div>








                <div class="form-buttons">


                    <button
                            class="primary-btn"
                            onclick="updateTask()">


                       حفظ التعديل


                    </button>





                    <button
                            class="cancel-btn"
                            onclick="history.back()">


                        ↩ تراجع


                    </button>




                </div>






            </div>





        </div>





    </div>




</div>






<script type="module" src="tasks.js"></script>


</body>

</html>
