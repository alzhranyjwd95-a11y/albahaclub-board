</head>



<body>

    <div class="sidebar-brand">

        <h2>

        </h2>

    </div>




    <ul class="sidebar-menu">

            </a>

        </li>



        <li>

            <a href="meetings.html">
                📅 الاجتماعات
            </a>

        </li>




        <li class="active">

            <a href="minutes.html">
                📄 المحاضر
            </a>

        </li>




        <li>

            <a href="tasks.html">
                ☑️ المهام
            </a>

        </li>




        <li>

            <a href="votes.html">
                📊 التصويتات
            </a>

        <li>

            <a href="decisions.html">
                ⚖️ القرارات
            </a>

        <li>

            <a href="reports.html">
                📈 التقارير
            </a>

        </li>



    </ul>


</div>







<div class="main-wrapper">



    <div class="topbar">


        <div class="brand-header">
            <img src="images/logo.jpg">

            <div>

                <h1>
                    جمعية أدبي الباحة
                </h1>


                <p>
                    منصة مجلس الإدارة
                </p>


            </div>


        </div>


    </div>







    <div class="dashboard-body">





        <div class="form-page">



            <div class="form-card">





                <div class="form-group">

                    <label>
                        عنوان المحضر
                    </label>


                    <input id="title">

                </div>






                <div class="form-group">

                    <label>
                        الاجتماع المرتبط
                    </label>


                    <input id="meeting">

                </div>






                <div class="form-group">

                    <label>
                        التاريخ
                    </label>


                    <input
                            type="date"
                            id="date">

                </div>







                <div class="form-group">


                    <label>
                        التفاصيل
                    </label>


                    <textarea id="description"></textarea>


                </div>







                <div class="form-buttons">



                    <button
                            class="primary-btn"
                            onclick="addMinute()">


                        حفظ


                    </button>





                    <button
                            class="cancel-btn"
                            onclick="history.back()">


                        ↩ تراجع


                    </button>




                </div>





            </div>





        </div>





    </div>




</div>







<script type="module" src="minutes.js"></script>



</body>
