<!DOCTYPE html>

    <title>
        التقارير - جمعية أدبي الباحة
    </title>


    <link rel="stylesheet" href="style.css">


    <style>

        .report-card {

            background:white;

            padding:20px;

            border-radius:15px;

            margin-bottom:16px;

            box-shadow:0 3px 12px rgba(0,0,0,.05);

            display:flex;

            justify-content:space-between;

            align-items:center;

        }



        .report-info {

            display:flex;

            gap:15px;

            align-items:center;

        }



        .report-icon {

            font-size:35px;

        }



        .report-details h3 {

            margin:0;

            color:#0d1b2a;

        }



        .report-meta {

            color:#64748b;

        }



        .report-desc {

            background:#f8fafc;

            padding:10px;

            border-radius:8px;

            border-right:3px solid #b8902f;

            margin-top:10px;

        }



        .report-actions {

            display:flex;

            gap:15px;

            align-items:center;

        }



        .download-btn {

            background:#0d1b2a;

            color:white;

            padding:10px 18px;

            border-radius:10px;

            text-decoration:none;

        }



        .delete-btn {

            background:#173b8f;

            color:white;

            border:none;

            padding:10px 18px;

            border-radius:10px;

            cursor:pointer;

        }



    </style>


</head>
