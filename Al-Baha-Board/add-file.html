        <li>

            <a href="reports.html">

            </a>

    </ul>

</div>





<div class="main-wrapper">


    <div class="topbar">


        <div class="brand-header">
            <img src="images/logo.jpg">
            <div>

                <h1>
                    جمعية أدبي الباحة
                </h1>

                <p>
                    منصة مجلس الإدارة
                </p>

            </div>

        </div>


    </div>





    <div class="dashboard-body">



        <div class="form-page">

            <div class="form-card">



                <div class="form-group">

                    <label>
                        اسم أو عنوان الملف
                    </label>


                    <input
                            id="title"
                            placeholder="مثال: محضر الاجتماع / نتائج التصويت">

                </div>





                <div class="form-group">

                    <label>
                        اختر الملف من جهازك
                    </label>


                    <input
                            type="file"
                            id="fileInput">


                    <small>
                        PDF - Word - Excel - صور
                    </small>


                </div>





                <p id="uploadStatus"
                   style="display:none">

                    جاري تجهيز وحفظ الملف...

                </p>






                <div class="form-buttons">


                    <button
                            class="primary-btn"
                            id="saveBtn"
                            onclick="uploadDirectFile()">


                        حفظ ورفع


                    </button>




                    <button
                            class="cancel-btn"
                            onclick="history.back()">


                        ↩ تراجع


                    </button>



                </div>





            </div>



        </div>



    </div>


</div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDRe0sxYnR7QVzhXkbR3H0ZhLcfxla7LgA",
        authDomain: "al-baha-literary-club-board.firebaseapp.com",
        projectId: "al-baha-literary-club-board",
        storageBucket: "al-baha-literary-club-board.firebasestorage.app",
        messagingSenderId: "451049449840",
        appId: "1:451049449840:web:9c3b9aca29d0c97b8287b5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    onAuthStateChanged(auth, (user) => {
        currentUser = user;
    });

    window.uploadDirectFile = async function() {
        const title = document.getElementById("title").value.trim();
        const fileInput = document.getElementById("fileInput");
        const file = fileInput.files[0];
        const statusText = document.getElementById("uploadStatus");
        const saveBtn = document.getElementById("saveBtn");

        if (!title || !file) {
            alert("يرجى إدخال اسم الملف واختيار ملف من جهازك");
            return;
        }

        // فحص حجم الملف (أقل من 1 ميغابايت ليناسب المستند في Firestore)
        if (file.size > 1024 * 1024) {
            alert("حجم الملف كبير، يرجى اختيار ملف بحجم أقل من 1 ميجابايت");
            return;
        }

        saveBtn.disabled = true;
        statusText.style.display = "block";

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const base64Data = e.target.result;

                await addDoc(collection(db, "files"), {
                    title: title,
                    fileName: file.name,
                    fileType: file.type || "application/octet-stream",
                    fileData: base64Data,
                    uploadedBy: currentUser ? currentUser.email : "عضو",
                    date: new Date().toLocaleDateString('ar-SA')
                });

                alert("تم رفع وحفظ الملف بنجاح!");
                location.href = "files.html";
            } catch (err) {
                console.error("خطأ أثناء الرفع:", err);
                alert("حدث خطأ أثناء حفظ الملف");
                saveBtn.disabled = false;
                statusText.style.display = "none";
            }
        };

        reader.readAsDataURL(file);
    };
</script>
</body>
</html>
